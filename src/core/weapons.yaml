# Оружие перестрелки. Правится без кода: загрузчик в weapons.ts проверяет форму.
#
# Дальности — в клетках по октильной метрике, времена — в модельных мс,
# шансы — в тысячных (ГПСЧ даёт целое 0..999). Всё целое: бой детерминирован.
#
#   fireRange  — дальше не стреляет (видит на SIGHT_RANGE из tuning.ts)
#   aimMs      — пауза перед первым выстрелом по новой цели
#   reloadMs   — между выстрелами
#   fireMs     — сколько фигура держит позу выстрела (≤ reloadMs)
#   hitBase    — шанс в упор без укрытия
#   hitPerCell — прибавка к шансу на клетку дальности (отрицательная)
#   coverMul   — множитель шанса по укрытому
#   damage     — снимает здоровья за попадание (HP в tuning.ts)
#   burst      — выстрелов в очереди (необязательно, 1 — одиночный)
#   burstMs    — между выстрелами внутри очереди, fireMs..reloadMs
#
# Очередь — это burst бросков подряд: шанс за очередь выше одиночного,
# поэтому hitBase у автомата ниже, а reloadMs — пауза уже между очередями.

rifle:
  name: винтовка
  fireRange: 8
  aimMs: 800
  reloadMs: 1200
