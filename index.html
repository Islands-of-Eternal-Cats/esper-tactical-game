<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>NINE LIVES CORP — срез «Ржавый»</title>
    <!-- Киты — самое тяжёлое; браузер начинает их тянуть вместе с кодом, не после него. -->
    <link rel="preload" href="%BASE_URL%models/character-kit.glb" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%models/env-kit.glb" as="fetch" crossorigin />
    <style>
      :root {
        color-scheme: dark;
        --ink: #cfd6e0;
        --dim: #7e8899;
        --line: #2c333e;
        --panel: #191d24;
        --accent: #c2703a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #14171c;
        color: var(--ink);
        font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      /* Виньетка: края темнеют, взгляд собирается к двору. Нуар без неё — просто тёмная комната. */
      /* Занавес до загрузки китов: тёмный, с именем — не «грузится», а заставка. */
      #veil {
        position: fixed; inset: 0; z-index: 2;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: #0f1215;
        transition: opacity .6s ease;
      }
      #veil.gone { opacity: 0; pointer-events: none; }
      #veil .brand { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
      #veil .slice { font-size: 12px; letter-spacing: .12em; color: var(--dim); }
      #veil .stage { margin-top: 12px; font-size: 11px; letter-spacing: .14em; color: var(--dim); font-variant-numeric: tabular-nums; }
      #veil .bar { width: 180px; margin-top: 8px; background: #1c2128; }
      #veil .bar > i { transition: width .12s linear; }
      /* До первого байта китов идёт код: доли нет, полоска дышит. */
      #veil:not(.loading) .bar > i { width: 30%; animation: veil-pulse 1.1s ease-in-out infinite alternate; }
      @keyframes veil-pulse { from { opacity: .35; transform: translateX(0); } to { opacity: .9; transform: translateX(250%); } }
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 72% 68% at 50% 46%, transparent 55%, rgba(6, 8, 11, .62) 100%);
      }

      #hud {
        position: fixed; inset: auto auto 0 0;
        padding: 16px; display: flex; flex-direction: column; gap: 10px;
        pointer-events: none;
      }
      #hud > * { pointer-events: auto; }

      .panel {
        min-width: 260px; padding: 12px 14px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--line); border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      .name {
        font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--accent);
      }
      .status { margin-top: 2px; font-size: 15px; }
      .bar {
        margin-top: 9px; height: 4px; border-radius: 2px;
        background: #262c35; overflow: hidden;
      }
      .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .18s linear; }
      .totals { margin-top: 8px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

      .controls, .seeds { display: flex; gap: 6px; align-items: center; }
      .seeds label {
        font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
        color: var(--dim);
      }
      .seeds input {
        width: 84px; padding: 7px 9px;
        font: inherit; font-size: 12px; font-variant-numeric: tabular-nums;
        color: var(--ink); background: #12151b;
        border: 1px solid var(--line); border-radius: 6px;
      }
      .seeds input:focus { outline: none; border-color: var(--accent); }
      button {
        min-width: 42px; padding: 7px 10px;
        font: inherit; font-size: 12px; color: var(--ink);
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        cursor: pointer;
      }
      button:hover { border-color: #3d4757; }
      button.on { border-color: var(--accent); color: var(--accent); }

      .hint { font-size: 11px; color: #5d6675; max-width: 420px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="vignette"></div>
    <div id="veil">
      <div class="brand">Nine Lives Corp</div>
      <div class="slice">срез «Ржавый»</div>
      <!-- Этапы, а не проценты: байты честно считаются только у моделей. -->
      <div class="stage">код</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
